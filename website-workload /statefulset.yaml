apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nexusai-statefulset
spec:
  selector:
    matchLabels:
      app: nexusai

  serviceName: "nexusai"
  replicas: 3 # by default is 1
  minReadySeconds: 10 # by default is 0
  template:
    metadata:
      labels:
        app: nexusai
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: nexusai
        image: priniel/nexusai:1.0
        ports:
        - containerPort: 80
          name: nexusai
